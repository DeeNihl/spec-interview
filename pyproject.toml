[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spec-interview"
version = "0.1.0"
description = "Provider-neutral conversational runtime for technical specification interviews"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dee" }]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
audio = ["sounddevice>=0.5"]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
spec-interview = "spec_interview.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_interview"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spec_interview"]

